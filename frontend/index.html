<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Notes App</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">

    </script>
</head>

<body>

    <div class="container">

        <h1>AI Notes Organizer</h1>

        <div class="top-right-buttons">

            <button id="theme-btn">
                🌙 Dark Mode
            </button>

            <button onclick="logout()" class="logout-btn">
                🚪 Logout
            </button>

        </div>

        <div class="note-input">

            <input type="text" id="title" placeholder="Enter note title">

            <select id="category">
                <option value="Study">📚 Study</option>
                <option value="Work">💼 Work</option>
                <option value="Personal">👤 Personal</option>
            </select>

            <textarea id="content" placeholder="Write your note"></textarea>



            <div class="counter">
                Words: <span id="word-count">0</span> |
                Characters: <span id="char-count">0</span>
            </div>

            <button onclick="addNote()">
                Add Note
            </button>
            <button onclick="exportTXT()">
                📄 Export TXT
            </button>
            <button onclick="exportPDF()">
                📑 Export PDF
            </button>


        </div>
        <select id="filter">
            <option value="All">All Notes</option>
            <option value="Study">📚 Study</option>
            <option value="Work">💼 Work</option>
            <option value="Personal">👤 Personal</option>
        </select>

        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="search" placeholder="Search notes by title...">
        </div>
        <button onclick="showTrash()">
            🗑️ Trash Bin
        </button>

        <div id="notes-container">

        </div>

    </div>

    <script type="module" src="script.js"></script>

</body>

</html>
